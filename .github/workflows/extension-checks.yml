# Runs the extension checks (tools/check-extension.mjs) by itself whenever the
# extension or the checks change. A red ✗ on GitHub = something to look at
# before sending a new version to the Chrome Web Store.
name: Extension checks
on:
  push:
    paths:
      - 'extension/**'
      - 'tools/check-extension.mjs'
      - '.github/workflows/extension-checks.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node tools/check-extension.mjs
