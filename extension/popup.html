<!doctype html>
<html><head><meta charset="utf-8">
<style>
 body{font:14px system-ui,sans-serif;background:#0d1117;color:#dbe7f5;margin:0;padding:14px;width:250px}
 h1{font-size:15px;margin:0 0 10px;color:#8fe3ff}
 select,input,button{font:inherit;width:100%;box-sizing:border-box;margin:4px 0;padding:6px;border-radius:6px;border:1px solid #2a3442;background:#161d27;color:#dbe7f5}
 button{background:#1f6feb;border:0;font-weight:bold;cursor:pointer}
 #s{min-height:18px;margin-top:6px;color:#9aa8bb}
</style></head>
<body>
 <h1>Skippy&apos;s Command Deck</h1>
 <select id="k">
  <option value="building">Building</option>
  <option value="lot">Lot (full id)</option>
  <option value="ship">Ship</option>
  <option value="asteroids">Asteroid</option>
 </select>
 <input id="n" inputmode="numeric" placeholder="ID number, e.g. 42849">
 <button id="go">Go ▸</button>
 <div id="s"></div>
 <script src="popup.js"></script>
</body></html>
